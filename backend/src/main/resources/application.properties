spring.application.name=bloodconnect-api
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=${SERVER_PORT:8080}
server.servlet.context-path=/
server.forward-headers-strategy=framework

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/bloodconnect_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Santo_Domingo
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

bloodconnect.country=DO
bloodconnect.locale=es-DO
bloodconnect.timezone=America/Santo_Domingo
bloodconnect.date-format=dd/MM/yyyy
bloodconnect.datetime-format=dd/MM/yyyy hh:mm a
bloodconnect.public-site-url=${PUBLIC_SITE_URL:}

jwt.secret=${JWT_SECRET:CHANGE_ME_WITH_A_SECURE_SECRET_AT_LEAST_256_BITS_LONG_FOR_HS256}
jwt.expiration-ms=${JWT_EXPIRATION:900000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION:604800000}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8080}
