# Perfil local de desarrollo: transporte STDIO.
# No mezclar logs de la aplicación con stdout: el protocolo MCP usa stdin/stdout.
spring.main.banner-mode=off
spring.main.web-application-type=none

bloodconnect.mcp.enabled=true
spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.stdio=true
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.name=${MCP_SERVER_NAME:bloodconnectrd-mcp}
spring.ai.mcp.server.version=${MCP_SERVER_VERSION:1.0.0}

logging.config=classpath:logback-mcp-stdio.xml
