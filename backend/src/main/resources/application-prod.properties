spring.jpa.show-sql=false
logging.level.com.bloodconnect=INFO
logging.level.org.springframework.security=WARN

bloodconnect.password-reset.url=${PASSWORD_RESET_URL:https://bloodconnectrd.com.do/reset-password}

bloodconnect.password-reset.expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:30}

bloodconnect.password-reset.mail-enabled=${PASSWORD_RESET_MAIL_ENABLED:true}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
